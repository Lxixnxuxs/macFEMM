[project]
name = "pymacfemm"
version = "0.1.0"
description = "Native macOS/Linux driver for the FEMM 4.2 finite-element solvers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pymacfemm"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
no-build = false
package = true
